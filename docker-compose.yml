version: '3.8'

# ==============================================================================
# POSSD DOCUMENT TRACKING SYSTEM - DOCKER COMPOSE CONFIGURATION
#
# SECURITY ARCHITECTURE NOTICE:
# - PostgreSQL is kept strictly on the isolated internal Docker bridge network (possd-network).
# - Port 5432 is ONLY bound to localhost (127.0.0.1:5432) for local dev inspection.
# - IN PRODUCTION: Comment out or remove the 'ports' section under 'postgres'.
#   PostgreSQL MUST NEVER be exposed directly to the public Internet.
# - External traffic routes strictly through Nginx (ports 80/443) -> possd-api (port 3000).
# ==============================================================================

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - possd-api
    networks:
      - possd-network
    restart: unless-stopped

  possd-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://possd_user:possd_secure_pass@postgres:5432/possd
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=possd
      - DB_USER=possd_user
      - DB_PASSWORD=possd_secure_pass
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - possd-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: possd
      POSTGRES_USER: possd_user
      POSTGRES_PASSWORD: possd_secure_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    # For local developer inspection only: binds to loopback interface.
    # CRITICAL: In production deployments, remove or comment out this mapping.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U possd_user -d possd"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - possd-network
    restart: unless-stopped

networks:
  possd-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
